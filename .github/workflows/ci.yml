name: Logistics Vision AI Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  mobile_ci:
    name: Flutter Lint & Test Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java Development Kit
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Engine SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Verify Code Formatting
        run: |
          cd apps/mobile
          dart format --set-exit-if-changed lib/

      - name: Execute Linter Checks
        run: |
          cd apps/mobile
          flutter analyze

      - name: Execute Automated Tests
        run: |
          cd apps/mobile
          flutter test

  backend_ci:
    name: FastAPI Lint & Python Audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python Runtime Environment
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Requirements
        run: pip install -r apps/backend/requirements.txt ruff mypy

      - name: Execute Lint Audits (Ruff)
        run: |
          # Runs check if apps/backend code is populated
          if [ -d "apps/backend" ]; then
            ruff check apps/backend --ignore E501
          fi

      - name: Execute Backend Tests
        run: cd apps/backend && pytest tests

  admin_web_ci:
    name: Admin Web Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci
        working-directory: apps/admin-web
      - run: npm run lint
        working-directory: apps/admin-web
      - run: npm run build
        working-directory: apps/admin-web
