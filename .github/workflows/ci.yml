name: Logistics Vision AI Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  mobile_ci:
    name: Flutter Lint & Test Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java Development Kit
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Engine SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Verify Code Formatting
        run: |
          cd apps/mobile
          dart format --set-exit-if-changed lib/

      - name: Execute Linter Checks
        run: |
          cd apps/mobile
          # Errors fail CI. Existing non-blocking cleanup notes remain visible
          # while they are retired in small, reviewable batches.
          flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Execute Automated Tests
        run: |
          cd apps/mobile
          flutter test

  android_release_smoke:
    name: Android ARM64 Release Build
    runs-on: ubuntu-latest
    needs: mobile_ci
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java Development Kit
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Engine SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create temporary CI signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/smartload-ci.jks" \
            -storepass ci-release-password \
            -keypass ci-release-password \
            -alias smartload-ci \
            -keyalg RSA -keysize 4096 -validity 1 \
            -dname "CN=SmartLoad CI, OU=Engineering, O=Vinayak, C=IN"

      - name: Build signed ARM64 release smoke APK
        working-directory: apps/mobile
        env:
          SMARTLOAD_KEYSTORE_PATH: ${{ runner.temp }}/smartload-ci.jks
          SMARTLOAD_KEYSTORE_PASSWORD: ci-release-password
          SMARTLOAD_KEY_ALIAS: smartload-ci
          SMARTLOAD_KEY_PASSWORD: ci-release-password
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Preserve APK for failed-build investigation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartload-arm64-release-smoke
          path: apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: ignore
          retention-days: 7

  backend_ci:
    name: FastAPI Lint & Python Audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python Runtime Environment
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Requirements
        run: pip install -r apps/backend/requirements-dev.txt

      - name: Check Backend Dependency Advisories
        run: pip-audit -r apps/backend/requirements.txt

      - name: Verify Database Migration
        run: |
          cd apps/backend
          DATABASE_URL=sqlite+aiosqlite:///./ci_migration.sqlite alembic upgrade head

      - name: Execute Lint Audits (Ruff)
        run: |
          # Runs check if apps/backend code is populated
          if [ -d "apps/backend" ]; then
            ruff check apps/backend --ignore E501
          fi

      - name: Execute Backend Tests
        run: cd apps/backend && pytest tests

  admin_web_ci:
    name: Admin Web Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci
        working-directory: apps/admin-web
      - run: npm run lint
        working-directory: apps/admin-web
      - run: npm run build
        working-directory: apps/admin-web
      - run: npm audit --omit=dev --audit-level=low
        working-directory: apps/admin-web
