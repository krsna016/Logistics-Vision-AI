name: mobile
description: "Logistics Vision AI - Mobile client application"
publish_to: 'none'

version: 1.0.18+10020

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.0.0

  # Hardware Capabilities
  # CameraX is the endorsed Android backend in 0.11+. Its image-analysis
  # backpressure avoids flooding Flutter when OCR cannot consume every frame.
  camera: ^0.11.2+1
  google_mlkit_text_recognition: ^0.15.0
  permission_handler: ^11.3.0
  geolocator: ^14.0.2
  image_picker: ^1.0.7
  # State Management & Dependency Injection
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Network
  dio: ^5.11.0

  # Offline Storage (Interface prep)
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.2.2

  # Logging & Telemetry
  logger: ^2.1.0

  # Modern UI Elements & Icons
  cupertino_icons: ^1.0.6
  onnxruntime: ^1.4.1
  image: ^4.3.0
  flutter_markdown_plus: ^1.0.12
  connectivity_plus: ^7.3.1
  fl_chart: ^1.2.0
  share_plus: ^12.0.2
  archive: ^3.6.1
  path_provider: ^2.1.6
  csv: ^8.0.0
  crypto: ^3.0.7
  pdf: ^3.12.0
  printing: ^5.14.3
  excel: ^4.0.6
  qr_flutter: ^4.1.0
  jwt_decoder: ^2.0.1
  desktop_drop: ^0.7.1

  path: any
  sqlite3: any
  uuid: any
  intl: ^0.20.3
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  riverpod_generator: ^2.3.9
  drift_dev: ^2.14.1
  build_runner: ^2.4.8

  # Linting
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/stage1_carton_yolo26m_seg_960.onnx
