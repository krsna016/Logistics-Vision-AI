name: mobile
description: "Logistics Vision AI - Mobile client application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.0.0

  # Hardware Capabilities
  camera: ^0.10.5+8
  permission_handler: ^11.3.0
  image_picker: ^1.0.7
  # State Management & Dependency Injection
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Network
  dio: ^5.4.0

  # Offline Storage (Interface prep)
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Logging & Telemetry
  logger: ^2.1.0

  # Modern UI Elements & Icons
  cupertino_icons: ^1.0.6
  onnxruntime: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  riverpod_generator: ^2.3.9
  drift_dev: ^2.14.1
  build_runner: ^2.4.8

  # Linting
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
